apiVersion: skaffold/v4beta13
kind: Config
metadata:
  name: secrets-manager-skaffold

profiles:
  - name: dev
    activation:
      - command: dev
    deploy:
      helm:
        releases:
          - name: secrets-manager
            chartPath: helm/
            namespace: secrets-manager
            valuesFiles:
              - helm/values-dev.yaml

  - name: prod
    deploy:
      helm:
        releases:
          - name: secrets-manager
            chartPath: helm/
            namespace: secrets-manager
            wait: true
            upgradeOnChange: true

